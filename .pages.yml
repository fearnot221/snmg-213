media:
  input: public/images/uploads
  output: /images/uploads
  extensions: [png, jpg, jpeg, webp, gif, pdf]
  rename: safe
content:
  - name: posts
    label: 文章與公告
    type: collection
    path: src/content/posts
    format: json
    filename: '{fields.slug}.json'
    view:
      primary: title
      fields: [title, category, published, date]
      sort: [date, title]
      search: [title, summary]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 文章標題
        type: string
        required: true
      - name: slug
        label: 文章網址（中英文、數字、連字號）
        type: string
        required: true
      - name: category
        label: 分類
        type: select
        options:
          values: [公告, 教學文件, 機房日誌, 招募資訊]
        default: 公告
        required: true
      - name: summary
        label: 文章摘要
        type: text
        required: true
      - name: date
        label: 發布日期（台灣時間）
        type: date
        options:
          format: yyyy-MM-dd
        required: true
      - name: published
        label: 公開發布
        type: boolean
        default: false
      - name: pinned
        label: 置頂文章
        type: boolean
        default: false
      - name: source
        label: 原站完整文章網址（選填）
        type: string
      - name: body
        label: 文章內容
        type: rich-text
        options:
          format: markdown
        required: true
  - name: site
    label: 網站內容與聯絡資訊
    type: file
    path: src/content/site/settings.json
    format: json
    fields:
      - name: heroTitle
        label: 首頁標題（兩行，每行建議六字內）
        type: text
        required: true
      - name: heroDescription
        label: 首頁介紹
        type: text
        required: true
      - name: aboutText
        label: 關於機房
        type: text
        required: true
      - name: recruitmentText
        label: 培訓與招募介紹
        type: text
        required: true
      - name: email
        label: 公務信箱
        type: string
        required: true
      - name: phone
        label: 電話／分機
        type: string
        required: true
      - name: officeHours
        label: 辦公時間
        type: string
        required: true
      - name: networkForm
        label: 網路異常回報表單網址
        type: string
        required: true
      - name: dnsForm
        label: DNS 申請表單網址
        type: string
        required: true
      - name: mailForm
        label: 郵件異常回報表單網址
        type: string
        required: true
settings:
  content:
    merge: true
  commit:
    templates:
      create: 'content: add {path}'
      update: 'content: update {path}'
      delete: 'content: remove {path}'
      rename: 'content: rename {oldPath} to {newPath}'
